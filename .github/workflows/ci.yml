name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
        exclude:
          # The oldest supported Python on one OS is enough.
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Tests
        run: uv run --python ${{ matrix.python }} --with pytest pytest -q tests test_anirss.py
      - name: Launcher runs
        run: uv run --python ${{ matrix.python }} python anirss --version
      # zsh ships on macOS runners and bash on Linux ones, so neither needs an
      # install step (apt on the runners can stall for minutes).
      - name: zsh completion parses
        if: runner.os == 'macOS'
        run: zsh -n completions/_anirss
      - name: bash completion parses
        if: runner.os == 'Linux'
        run: bash -n completions/anirss.bash
