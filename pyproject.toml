# Packaging metadata so other projects can depend on anirss:
#   uv add git+https://github.com/marcusbandit/anirss          (Python projects)
#   uv tool install git+https://github.com/marcusbandit/anirss (the `anirss` command)
# The repo still needs no build step: ./anirss, install.sh, AUR and brew run
# straight from the checkout and ignore this file.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "anirss"
dynamic = ["version"]
description = "Find anime releases on the search endpoints you add (signed endpoint repos, nyaa-style sites, RSS feeds), then subscribe or download through qBittorrent and watch in any player. CLI, Python library, and JSON HTTP API."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
proctitle = ["setproctitle"]

[project.scripts]
anirss = "anirss_lib.main:main"

[project.urls]
Homepage = "https://github.com/marcusbandit/anirss"

[tool.setuptools]
packages = ["anirss_lib", "anirss_lib.cli", "anirss_lib.qbt"]

[tool.setuptools.package-data]
anirss_lib = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "anirss_lib.__version__" }
